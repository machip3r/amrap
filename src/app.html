<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<title>AMRAP</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ff6b6b" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="AMRAP" />
		<meta name="application-name" content="AMRAP" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="icon" href="/favicon.ico?v=4" sizes="32x32" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-light.png?v=4"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-dark.png?v=4"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="/favicon-light-48.png?v=4"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="/favicon-dark-48.png?v=4"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
