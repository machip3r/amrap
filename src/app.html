<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<!-- Document <title> is set per-route (SeoHead / locale layout). Do not put a brand-only title here — Google often uses the first <title> in HTML. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ff6b6b" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="AMRAP" />
		<meta name="application-name" content="AMRAP" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="icon" href="/favicon.ico?v=4" sizes="32x32" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-light.png?v=4"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-dark.png?v=4"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="/favicon-light-48.png?v=4"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="/favicon-dark-48.png?v=4"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
		<!-- Theme before first paint so #amrap-boot matches light/dark -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('amrap-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.classList.toggle('dark', theme === 'dark');
				} catch (e) {}
				document.documentElement.classList.add('amrap-booting');
			})();
		</script>
		<style>
			/*
			 * Do NOT set overflow:hidden on html/body while booting — unlocking it
			 * after splash is a common iOS PWA cause of a permanent bottom gap.
			 * Block interaction on the overlay only.
			 */
			#amrap-boot {
				position: fixed;
				inset: 0;
				z-index: 99999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				margin: 0;
				background: #f8fafc;
				color: #0f172a;
				touch-action: none;
				overscroll-behavior: none;
				-webkit-user-select: none;
				user-select: none;
			}
			html.dark #amrap-boot {
				background: #0b1120;
				color: #f8fafc;
			}
			#amrap-boot[data-done] {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
				transition:
					opacity 0.2s ease,
					visibility 0.2s ease;
			}
			#amrap-boot .amrap-boot-logo {
				width: min(42vw, 9rem);
				height: auto;
				display: block;
			}
			#amrap-boot .amrap-boot-logo-dark {
				display: none;
			}
			html.dark #amrap-boot .amrap-boot-logo-light {
				display: none;
			}
			html.dark #amrap-boot .amrap-boot-logo-dark {
				display: block;
			}
			#amrap-boot .amrap-boot-spin {
				width: 1.75rem;
				height: 1.75rem;
				border: 2.5px solid rgba(255, 107, 107, 0.25);
				border-top-color: #ff6b6b;
				border-radius: 50%;
				animation: amrap-boot-spin 0.7s linear infinite;
			}
			@keyframes amrap-boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="amrap-boot" aria-hidden="true">
			<img
				class="amrap-boot-logo amrap-boot-logo-light"
				src="/amrap-hero-logo-black.png"
				alt=""
				width="144"
				height="48"
				decoding="async"
			/>
			<img
				class="amrap-boot-logo amrap-boot-logo-dark"
				src="/amrap-hero-logo-white.png"
				alt=""
				width="144"
				height="48"
				decoding="async"
			/>
			<div class="amrap-boot-spin" aria-hidden="true"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				/**
				 * iOS standalone dead-end recovery.
				 * A stale service worker can hydrate the wrong shell for `/app` and leave
				 * SvelteKit’s bare “404 Not Found” with no chrome to navigate away.
				 */
				function isStandalone() {
					try {
						return (
							window.matchMedia('(display-mode: standalone)').matches ||
							window.matchMedia('(display-mode: fullscreen)').matches ||
							/** @type {Navigator & { standalone?: boolean }} */ (window.navigator)
								.standalone === true
						);
					} catch (e) {
						return false;
					}
				}

				function isBareKit404() {
					var text = (document.body && document.body.innerText) || '';
					var compact = text.replace(/\s+/g, ' ').trim();
					return compact === '404 Not Found' || /^404\s*Not Found$/i.test(compact);
				}

				function recover() {
					if (!isStandalone() || !isBareKit404()) return;
					var path = window.location.pathname || '';
					if (path === '/app' || path.indexOf('/app/') === 0) {
						if (!('serviceWorker' in navigator)) {
							window.location.replace('/app?recover=' + Date.now());
							return;
						}
						navigator.serviceWorker
							.getRegistrations()
							.then(function (regs) {
								return Promise.all(
									regs.map(function (r) {
										return r.unregister();
									})
								);
							})
							.catch(function () {})
							.then(function () {
								window.location.replace('/app?recover=' + Date.now());
							});
						return;
					}
					window.location.replace('/app');
				}

				function schedule() {
					window.setTimeout(recover, 80);
				}

				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', schedule);
				} else {
					schedule();
				}
				window.addEventListener('pageshow', schedule);
			})();
		</script>
	</body>
</html>
